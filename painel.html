<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel RG Marques 3D</title>
<link rel="icon" href="img/icone-perfil.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fila de pedidos como uma mesa de produção. Cada pedido é uma ficha com as peças, o arquivo e as três etapas (Pix, impresso, enviado). */
:root {
  --bg: #F3F1EE; --card: #FFFFFF; --fg: #151515; --muted: #6A645D; --line: #E2DDD6;
  --accent: #F26B1D; --accent-fg: #FFFFFF; --ok: #1F8A4C; --ok-bg: #DDF2E5; --wait: #A35A00; --wait-bg: #FCEBD6;
  --chip: #EEEAE4;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121110; --card: #1D1B19; --fg: #F3F1EE; --muted: #A59E95; --line: #2F2C29;
  --accent: #F27A33; --accent-fg: #151515; --ok: #5FD08E; --ok-bg: #173523; --wait: #F2B366; --wait-bg: #3A2A16;
  --chip: #2A2724; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121110; --card: #1D1B19; --fg: #F3F1EE; --muted: #A59E95; --line: #2F2C29;
  --accent: #F27A33; --accent-fg: #151515; --ok: #5FD08E; --ok-bg: #173523; --wait: #F2B366; --wait-bg: #3A2A16;
  --chip: #2A2724; color-scheme: dark }
html { color-scheme: light; } *, *::before, *::after { box-sizing: border-box; } img { max-width: 100%; } [hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-display); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-size: 26px; font-weight: 800; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px; padding: 9px 14px; font: 600 14px var(--font-display); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:focus-visible, .chip:focus-visible, .filtro:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .55; cursor: default; }
.resumo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.filtro { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; padding: 12px; cursor: pointer; font-family: var(--font-display); }
.filtro b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.filtro span { font-size: 12px; color: var(--muted); }
.filtro[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.aviso { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
.aviso.erro { border-color: var(--wait); }
.lista { display: grid; gap: 14px; }
.pedido { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.topo { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline; }
.cod { font: 500 15px var(--font-mono); letter-spacing: .02em; }
.cod small { color: var(--muted); font-size: 12px; margin-left: 8px; }
.valor { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.etapas { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 7px 12px; font: 600 13px var(--font-display); cursor: pointer; background: var(--wait-bg); color: var(--wait); }
.chip[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); }
.cliente { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 14px; line-height: 1.45; }
.cliente .end { color: var(--muted); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.cliente .copiar { grid-row: 1 / span 2; grid-column: 2; align-self: start; }
.itens { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--chip); border-radius: 12px; padding: 10px; }
.item .foto { width: 76px; height: 76px; border-radius: 10px; background: var(--card); object-fit: contain; display: grid; place-items: center; font: 500 11px var(--font-mono); color: var(--muted); text-align: center; }
.item h3 { margin: 0; font-size: 15px; }
.item p { margin: 2px 0 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.item .acoes .btn { padding: 7px 11px; font-size: 13px; }
.rastreio { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rastreio label { font-size: 13px; color: var(--muted); }
.rastreio input { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 9px 12px; font: 500 14px var(--font-mono); text-transform: uppercase; }
.msg { font-size: 12px; color: var(--muted); min-height: 1em; }
@media (max-width: 640px) { .resumo { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cliente { grid-template-columns: 1fr; } .cliente .copiar { grid-row: auto; grid-column: 1; justify-self: start; } }
@media (prefers-reduced-motion: no-preference) { .chip, .btn, .filtro { transition: background .15s, border-color .15s, color .15s; } }
.login { max-width: 380px; margin: 10vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; }
.login h1 { font-size: 22px; }
.login input[type=password] { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 11px 12px; font: 500 15px var(--font-mono); }
.login label.ck { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<form class="login wrap" id="login" hidden>
  <h1>Painel <span style="color:var(--accent)">RG</span> Marques 3D</h1>
  <p class="sub">Digite a senha que você colocou no código da planilha.</p>
  <input type="password" id="senha" autocomplete="current-password" aria-label="Senha do painel" required>
  <label class="ck"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
  <button class="btn primary" type="submit" id="entrar">Entrar</button>
  <p class="msg" id="login-msg"></p>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>Pedidos <span>RG</span> Marques 3D</h1>
      <p class="sub" id="atualizado">Lendo a planilha de pedidos…</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" id="abrir-planilha" target="_blank" rel="noopener">Abrir planilha</a>
      <button class="btn" id="sair" type="button">Sair</button>
      <button class="btn primary" id="atualizar" type="button">Atualizar</button>
    </div>
  </header>

  <div class="resumo" id="resumo">
    <button class="filtro" type="button" data-f="pix" aria-pressed="false"><b id="n-pix">–</b><span>Esperando Pix</span></button>
    <button class="filtro" type="button" data-f="imprimir" aria-pressed="true"><b id="n-imprimir">–</b><span>Para imprimir</span></button>
    <button class="filtro" type="button" data-f="enviar" aria-pressed="false"><b id="n-enviar">–</b><span>Para enviar</span></button>
    <button class="filtro" type="button" data-f="todos" aria-pressed="false"><b id="n-todos">–</b><span>Todos</span></button>
  </div>

  <div class="aviso" id="aviso" hidden></div>
  <div class="lista" id="lista"></div>
</div>

<script src="catalogo.js"></script>
<script>
const PLANILHA = "1ls3BkawCqITmB0AQJWqh0T21W_lCYpEsB_R6dz-3IHY";
const DRIVE = "https://drive.google.com/drive/folders/1uFcSX99qIZjviMzzBF_SuysN1nKnfQ-I";
// Modelos da RG que têm arquivo para imprimir (3MF multicores + STL de cada peça) na pasta do Drive
const ARQUIVOS = { "robo-rg": 1, "pinguim-rg": 1, "vaso-cacto-rg": 1, "suporte-gatinho-rg": 1, "foguete-rg": 1, "astronauta": 1,
  "organizador-mesa": 1, "porta-chaves": 1, "suporte-controle": 1, "suporte-headset": 1, "suporte-celular": 1, "kit-cabos": 1 };
const API = (window.CONFIG || {}).painel || "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { let t = String(v ?? "").replace(/[^0-9,.-]/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return Number(t) || 0; };
const brl = n => num(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
$("#abrir-planilha").href = "https://docs.google.com/spreadsheets/d/" + PLANILHA + "/edit";

let pedidos = [], filtro = "imprimir", senha = "";
try { filtro = localStorage.getItem("rg-painel-filtro") || filtro; senha = localStorage.getItem("rg-painel-senha") || ""; } catch (e) {}

function aviso(txt, erro) { const a = $("#aviso"); a.hidden = !txt; a.className = "aviso" + (erro ? " erro" : ""); a.innerHTML = txt || ""; }

async function api(dados) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ senha }, dados)) });
  const d = await r.json();
  if (!d.ok) { const e = new Error(d.erro || "erro"); e.code = d.erro; throw e; }
  return d;
}
function ler(values) {
  const linhas = (values || []).slice(1);
  return linhas.map((l, i) => {
    let itens = [];
    try { itens = JSON.parse(l[12] || "[]"); } catch (e) {}
    if (!itens.length && l[4]) itens = String(l[4]).split("\n").map(t => ({ nome: t, cores: "", qtd: "" }));
    return { linha: i + 2, data: l[0] || "", cod: l[1] || "", nome: l[2] || "", email: l[3] || "", valor: l[5] || "",
      pix: l[6] === "Sim", impresso: l[7] === "Sim", enviado: l[8] === "Sim", rastreio: l[9] || "", obs: l[10] || "", endereco: l[11] || "", itens };
  }).filter(p => p.cod).reverse();
}

const grupo = p => !p.pix ? "pix" : !p.impresso ? "imprimir" : !p.enviado ? "enviar" : "feito";

function render() {
  const n = { pix: 0, imprimir: 0, enviar: 0 };
  pedidos.forEach(p => { const g = grupo(p); if (n[g] !== undefined) n[g]++; });
  $("#n-pix").textContent = n.pix; $("#n-imprimir").textContent = n.imprimir; $("#n-enviar").textContent = n.enviar; $("#n-todos").textContent = pedidos.length;
  document.querySelectorAll(".filtro").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));
  const lista = pedidos.filter(p => filtro === "todos" || grupo(p) === filtro);
  if (!lista.length) {
    const vazio = { pix: "Nenhum pedido esperando Pix.", imprimir: "Nada para imprimir agora. Quando um Pix for confirmado, o pedido aparece aqui.", enviar: "Nada para enviar agora.", todos: "Ainda não chegou nenhum pedido pelo site." }[filtro];
    $("#lista").innerHTML = `<div class="aviso">${vazio}</div>`; return;
  }
  $("#lista").innerHTML = lista.map(p => `
    <article class="pedido" data-linha="${p.linha}">
      <div class="topo">
        <div class="cod">${esc(p.cod)}<small>${esc(p.data)}</small></div>
        <div class="valor">${brl(p.valor)}</div>
      </div>
      <div class="etapas">
        <button class="chip" type="button" data-col="G" aria-pressed="${p.pix}">${p.pix ? "✓ Pix recebido" : "Pix recebido?"}</button>
        <button class="chip" type="button" data-col="H" aria-pressed="${p.impresso}">${p.impresso ? "✓ Impresso" : "Impresso?"}</button>
        <button class="chip" type="button" data-col="I" aria-pressed="${p.enviado}">${p.enviado ? "✓ Enviado" : "Enviado?"}</button>
      </div>
      <div class="itens">${p.itens.map(item).join("")}</div>
      <div class="cliente">
        <div><b>${esc(p.nome)}</b> · ${esc(p.email)}</div>
        <div class="end">${esc(p.endereco || "Endereço não informado")}</div>
        ${p.endereco ? `<button class="btn copiar" type="button" data-copiar="${esc(p.nome + "\n" + p.endereco)}">Copiar endereço</button>` : ""}
      </div>
      <div class="rastreio">
        <label for="r-${p.linha}">Rastreio dos Correios</label>
        <input id="r-${p.linha}" value="${esc(p.rastreio)}" placeholder="AA123456789BR" maxlength="20" autocomplete="off">
        <button class="btn" type="button" data-salvar="${p.linha}">Salvar</button>
      </div>
      <div class="msg" id="m-${p.linha}">${p.obs ? "Obs.: " + esc(p.obs) : ""}</div>
    </article>`).join("");
}

function item(i) {
  const src = ARQUIVOS[i.id] ? "img/" + i.id + ".png" : (/^https:\/\//.test(i.img || "") ? i.img : "");
  const foto = src ? `<img class="foto" src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto',textContent:'sem foto'}))">` : `<div class="foto">sem<br>foto</div>`;
  const acoes = [];
  if (ARQUIVOS[i.id]) acoes.push(`<a class="btn primary" href="${DRIVE}" target="_blank" rel="noopener">Arquivo no Drive: ${esc(i.id)}.zip</a>`);
  if (/^https:\/\//.test(i.link || "")) acoes.push(`<a class="btn${ARQUIVOS[i.id] ? "" : " primary"}" href="${esc(i.link)}" target="_blank" rel="noopener">Abrir modelo para imprimir</a>`);
  return `<div class="item">${foto}<div>
    <h3>${i.qtd ? esc(i.qtd) + "× " : ""}${esc(i.nome)}</h3>
    <p>${esc(i.cores || "")}</p>
    <div class="acoes">${acoes.join("") || '<span class="msg">Sem arquivo ligado a este modelo.</span>'}</div>
  </div></div>`;
}

function erroTxt(e) {
  if (e && e.code === "senha") return "Senha errada. Confira a senha que está no código da planilha.";
  if (!API) return "O site ainda não está ligado à planilha.";
  return "Não foi possível falar com a planilha agora. Confira a internet e toque em Atualizar.";
}

async function carregar() {
  $("#atualizar").disabled = true;
  try {
    const d = await api({ acao: "listar" });
    pedidos = ler(d.valores);
    aviso("");
    $("#atualizado").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    render();
    return true;
  } catch (e) {
    if (e.code === "senha") { sair(erroTxt(e)); return false; }
    aviso(erroTxt(e), true);
    return false;
  } finally { $("#atualizar").disabled = false; }
}

async function gravar(linha, col, valor, msgOk) {
  const m = $("#m-" + linha);
  try { await api({ acao: "atualizar", linha, coluna: col, valor }); if (m) m.textContent = msgOk; return true; }
  catch (e) { if (m) m.textContent = "Não salvou: " + erroTxt(e); return false; }
}

function sair(msg) {
  senha = ""; try { localStorage.removeItem("rg-painel-senha"); } catch (e) {}
  $("#app").hidden = true; $("#login").hidden = false; $("#login-msg").textContent = msg || ""; $("#senha").value = ""; $("#senha").focus();
}

async function entrar() {
  $("#login").hidden = true; $("#app").hidden = false;
  render();
  if (await carregar()) { clearInterval(window._t); window._t = setInterval(() => { if (!document.hidden && senha) carregar(); }, 120000); }
}

$("#login").addEventListener("submit", e => {
  e.preventDefault();
  senha = $("#senha").value.trim();
  if ($("#lembrar").checked) { try { localStorage.setItem("rg-painel-senha", senha); } catch (err) {} }
  entrar();
});
$("#sair").onclick = () => sair("");

document.addEventListener("click", async e => {
  const f = e.target.closest(".filtro");
  if (f) { filtro = f.dataset.f; try { localStorage.setItem("rg-painel-filtro", filtro); } catch (err) {} render(); return; }

  const chip = e.target.closest(".chip");
  if (chip) {
    const linha = +chip.closest(".pedido").dataset.linha, p = pedidos.find(x => x.linha === linha);
    const chave = { G: "pix", H: "impresso", I: "enviado" }[chip.dataset.col];
    const novo = !p[chave];
    chip.disabled = true;
    if (await gravar(linha, chip.dataset.col, novo ? "Sim" : "Não", "Salvo na planilha.")) { p[chave] = novo; render(); }
    else chip.disabled = false;
    return;
  }

  const s = e.target.closest("[data-salvar]");
  if (s) {
    const linha = +s.dataset.salvar, v = $("#r-" + linha).value.trim().toUpperCase();
    s.disabled = true;
    if (await gravar(linha, "J", v, "Rastreio salvo.")) { const p = pedidos.find(x => x.linha === linha); if (p) p.rastreio = v; }
    s.disabled = false;
    return;
  }

  const c = e.target.closest("[data-copiar]");
  if (c) {
    const txt = c.dataset.copiar;
    try { await navigator.clipboard.writeText(txt); c.textContent = "Copiado ✓"; }
    catch (err) { const end = c.parentElement.querySelector(".end"); const sel = getSelection(); const r = document.createRange(); r.selectNodeContents(end); sel.removeAllRanges(); sel.addRange(r); c.textContent = "Selecionado, copie"; }
    return;
  }

});
$("#atualizar").onclick = () => carregar();

if (!API) { $("#login").hidden = false; $("#login-msg").textContent = "O site ainda não está ligado à planilha. Falta colocar o link do Apps Script no catalogo.js."; $("#entrar").disabled = true; }
else if (senha) entrar(); else sair("");
</script>
</body>
</html>
